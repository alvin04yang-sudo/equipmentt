<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>設備掃描借還系統</title>
    <!-- 引入 html5-qrcode 掃描套件 -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background-color: #f4f6f9; 
            margin: 0;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h2 { margin-bottom: 20px; color: #333; }
        
        .mode-switch {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .mode-btn {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #007bff;
            background: white;
            color: #007bff;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .mode-btn.active {
            background: #007bff;
            color: white;
        }
        
        #camera-select { 
            margin-bottom: 15px; 
            padding: 10px; 
            font-size: 15px; 
            border-radius: 6px; 
            border: 1px solid #ccc;
            width: 100%; 
            box-sizing: border-box;
        }
        #reader { 
            width: 100%; 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
        }
        #result { 
            margin-top: 20px; 
            font-size: 17px; 
            font-weight: bold; 
            color: #444; 
            white-space: pre-wrap; 
            line-height: 1.5; 
            min-height: 60px;
            padding: 12px;
            border-radius: 6px;
            background: #eef2f7;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📷 設備掃描借還系統</h2>

        <!-- 借用 / 歸還 模式切換鈕 -->
        <div class="mode-switch">
            <button id="btn-borrow" class="mode-btn active" onclick="setMode('borrow')">📤 借用設備</button>
            <button id="btn-return" class="mode-btn" onclick="setMode('return')">📥 歸還設備</button>
        </div>
        
        <!-- 相機選擇下拉選單 -->
        <select id="camera-select"></select>
        
        <div id="reader"></div>
        <div id="result">相機啟動中，請稍候...</div>
    </div>

    <script>
        // ★★★ 請替換成您的最新 GAS 網頁應用程式網址 ★★★
        const API_URL = "https://script.google.com/macros/s/AKfycbwGgKSGN77eJsRI8s3wcrjV5RtYparTVNz6WYsgVyY5vHBJB7QJyYgBhfIsrFUF3fPG/exec"; 

        let isProcessing = false; 
        let currentMode = "borrow"; // 預設模式為借用 (borrow)
        const html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 220, height: 220 } };
        const cameraSelect = document.getElementById('camera-select');
        const resultDiv = document.getElementById('result');

        // 切換借用/歸還模式
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn-borrow').classList.toggle('active', mode === 'borrow');
            document.getElementById('btn-return').classList.toggle('active', mode === 'return');
            resultDiv.style.color = "#444";
            resultDiv.style.background = "#eef2f7";
            resultDiv.innerText = `已切換至【${mode === 'borrow' ? '借用' : '歸還'}】模式，請對準 QR Code...`;
        }

        function onScanSuccess(decodedText) {
            if (isProcessing) return; 
            isProcessing = true;
            
            // 若 QR Code 包含 URL 參數，自動擷取 ID
            if (decodedText.includes("text=")) {
                decodedText = decodedText.split("text=")[1].split("&")[0];
            } else if (decodedText.includes("id=")) {
                decodedText = decodedText.split("id=")[1].split("&")[0];
            }
            
            decodedText = decodedText.trim();
            
            resultDiv.style.color = "#0056b3";
            resultDiv.innerText = `讀取編號：${decodedText}\n連線處理中...`;
            
            const targetUrl = `${API_URL}?id=${encodeURIComponent(decodedText)}&action=${currentMode}`;

            fetch(targetUrl, {
                method: "GET",
                redirect: "follow" // 強制跟隨 GAS 302 轉址
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP 錯誤 Status: ${response.status}`);
                }
                return response.text();
            })
            .then(text => {
                const isSuccess = text.includes("成功");
                resultDiv.style.color = isSuccess ? "#155724" : "#721c24";
                resultDiv.style.background = isSuccess ? "#d4edda" : "#f8d7da";
                resultDiv.innerText = text;

                setTimeout(() => { 
                    isProcessing = false; 
                    resultDiv.style.color = "#444";
                    resultDiv.style.background = "#eef2f7";
                    resultDiv.innerText = "請對準下一個 QR Code 進行掃描...";
                }, 3500); 
            })
            .catch(error => {
                console.error("連線詳細錯誤：", error);
                resultDiv.style.color = "#721c24";
                resultDiv.style.background = "#f8d7da";
                resultDiv.innerText = "系統連線錯誤！\n請檢查網路設定或 GAS 部署權限。";
                setTimeout(() => { 
                    isProcessing = false; 
                    resultDiv.style.background = "#eef2f7";
                }, 3500);
            });
        }

        // 啟動指定鏡頭
        function startCamera(cameraId) {
            html5QrCode.start(cameraId, config, onScanSuccess)
                .then(() => { 
                    resultDiv.innerText = "請對準 QR Code 進行掃描..."; 
                })
                .catch(err => { 
                    console.error("相機啟動錯誤:", err);
                    resultDiv.innerText = "無法存取相機，請確認瀏覽器權限。";
                });
        }

        // 讀取相機清單
        Html5Qrcode.getCameras().then(devices => {
            if (devices && devices.length) {
                let defaultCameraId = devices[0].id;

                devices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.id;
                    option.text = device.label || `相機 ${index + 1}`;
                    
                    // 優先預設選擇後鏡頭 (Back Camera)
                    if (device.label.toLowerCase().includes('back') || device.label.toLowerCase().includes('environment')) {
                        defaultCameraId = device.id;
                    }
                    cameraSelect.appendChild(option);
                });

                cameraSelect.value = defaultCameraId;
                startCamera(defaultCameraId);

                // 鏡頭切換事件 Listening
                cameraSelect.addEventListener('change', () => {
                    html5QrCode.stop().then(() => {
                        startCamera(cameraSelect.value);
                    }).catch(err => {
                        console.error("停止鏡頭失敗", err);
                    });
                });
            } else {
                resultDiv.innerText = "找不到可用的相機設備。";
            }
        }).catch(err => {
            console.error("無法取得相機清單", err);
            resultDiv.innerText = "無法取得相機權限，請於瀏覽器允許相機存取。";
        });
    </script>
</body>
</html>
